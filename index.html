<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B0D12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habits">
<title>Mes Habitudes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="topbar-text">
      <h1 id="title">Habitudes</h1>
      <p id="subtitle" class="sub"></p>
    </div>
    <div id="ring" class="ring" hidden>
      <svg viewBox="0 0 48 48">
        <circle class="ring-track" cx="24" cy="24" r="20"></circle>
        <circle id="ring-bar" class="ring-bar" cx="24" cy="24" r="20"></circle>
      </svg>
      <span id="ring-label"></span>
    </div>
  </header>

  <main id="view-home" class="view"></main>
  <main id="view-stats" class="view" hidden></main>

  <nav class="tabbar">
    <div class="tabbar-inner">
      <button class="tab active" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
        <span>Aujourd'hui</span>
      </button>
      <button id="fab" class="fab" aria-label="Ajouter une habitude">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="tab" data-tab="stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20v-9"/><path d="M12 20V4"/><path d="M19 20v-5"/></svg>
        <span>Stats</span>
      </button>
    </div>
  </nav>
</div>

<div id="backdrop" class="backdrop"></div>

<section id="sheet-edit" class="sheet" aria-hidden="true">
  <div class="handle"></div>
  <div class="sheet-head">
    <h2 id="edit-title">Nouvelle habitude</h2>
    <button class="icon-btn" data-close aria-label="Fermer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="edit-preview">
    <div id="edit-chip" class="chip lg">⭐</div>
    <input id="edit-name" type="text" maxlength="40" placeholder="Ex. Lire 20 minutes" autocomplete="off" enterkeyhint="done">
  </div>
  <p class="label">Émoji</p>
  <div id="emoji-grid" class="emoji-grid"></div>
  <p class="label">Couleur</p>
  <div id="color-grid" class="color-grid"></div>
  <button id="edit-save" class="btn-primary" disabled>Créer l'habitude</button>
</section>

<section id="sheet-detail" class="sheet" aria-hidden="true">
  <div class="handle"></div>
  <div id="detail-body"></div>
</section>

<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
