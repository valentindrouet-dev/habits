# Publie l'app sur GitHub Pages à chaque push sur la branche par défaut.
# L'URL obtenue est stable : le signet du téléphone reçoit chaque mise à jour.
name: Déployer sur GitHub Pages

on:
  push:
    branches: [claude/habit-tracking-app-dsgenl]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement:true active Pages automatiquement au premier passage
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Le site est statique : on publie la racine du dépôt telle quelle.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
